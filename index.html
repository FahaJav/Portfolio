<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030712">
<title>Fahad Javed — Portfolio | Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg-deep: #030712;
    --hud-cyan: #00f0ff;
    --hud-cyan-dim: rgba(0, 240, 255, 0.15);
    --hud-cyan-glow: rgba(0, 240, 255, 0.4);
    --hud-amber: #ffb700;
    --hud-amber-dim: rgba(255, 183, 0, 0.15);
    --hud-red: #ff3366;
    --text-main: #f0f6fc;
    --text-muted: #8b949e;
    --panel-bg: rgba(3, 7, 18, 0.85);
    --border-glow: rgba(0, 240, 255, 0.35);
  }

  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: var(--bg-deep); color: var(--text-main);
    font-family: 'Rajdhani', sans-serif;
  }

  /* Clean Vignette (scanlines and horizontal lines removed) */
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 100;
    background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,0.65) 100%);
  }

  .universe {
    position: fixed; inset: 0; overflow: hidden; transform-origin: 0 0;
    transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); will-change: transform;
    background: radial-gradient(circle at center, #0a1128 0%, #030712 100%);
  }

  .starfield {
    position: absolute; inset: -10%; opacity: 0.9;
    background-image: url('./assets/planets/stars-milky-way.jpg'),
                      radial-gradient(1px 1px at 10% 15%, #fff 90%, transparent),
                      radial-gradient(1.5px 1.5px at 35% 65%, #00f0ff 90%, transparent),
                      radial-gradient(1px 1px at 80% 25%, #ffb700 90%, transparent),
                      radial-gradient(2px 2px at 60% 80%, #fff 90%, transparent);
    background-size: cover, 400px 400px, 500px 500px, 350px 350px, 600px 600px;
    animation: driftBackground 120s linear infinite;
  }
  @keyframes driftBackground {
    from { transform: translate(0, 0); }
    to { transform: translate(-50px, -50px); }
  }

  /* Fixed Sun Position */
  .sun {
    position: absolute; z-index: 2; left: 0%; top: 50%;
    width: clamp(200px, 40vw, 600px); aspect-ratio: 1;
    transform: translate(-30%, -50%); border: 0; border-radius: 50%;
    cursor: pointer; background: radial-gradient(circle at 38% 34%, #fff9b5 0%, #ffdf33 30%, #ff8c00 70%, #ff3b00 100%);
    box-shadow: 0 0 50px 15px rgba(255, 140, 0, 0.5), 0 0 150px 50px rgba(255, 60, 0, 0.25);
  }

  /* Revolution Path Rings around Sun */
  .orbit-ring {
    position: absolute; left: 0%; top: 50%;
    border: 1px dashed rgba(0, 240, 255, 0.18);
    border-radius: 50%;
    transform: translate(-30%, -50%);
    pointer-events: none;
    z-index: 1;
  }

  /* Correct Solar System Order from Sun outwards */
  .orbit.mercury { left: 16%; top: 32%; z-index: 3; }
  .orbit.venus   { left: 24%; top: 24%; z-index: 3; }
  .orbit.earth   { left: 34%; top: 40%; z-index: 3; }
  .orbit.mars    { left: 44%; top: 28%; z-index: 3; }
  .orbit.jupiter { left: 56%; top: 36%; z-index: 3; }
  .orbit.saturn  { left: 68%; top: 26%; z-index: 3; }
  .orbit.uranus  { left: 80%; top: 44%; z-index: 3; }
  .orbit.neptune { left: 90%; top: 30%; z-index: 3; }

  .orbit {
    position: absolute;
    width: 96px; height: 96px;
    border: 0;
    transform: translate(-50%, -50%);
  }
  .track { position: absolute; inset: 0; }
  .planet-button {
    position: absolute; top: 0; left: 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 0; border: 0; background: none; cursor: pointer;
  }
  .planet-button:hover { transform: scale(1.18); z-index: 10; }
  .planet-body {
    width: 72px; height: 72px; border-radius: 50%; overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset -12px -12px 24px rgba(0,0,0,0.8);
    border: 2px solid rgba(0, 240, 255, 0.4);
    background: #000;
  }
  .orbit-planet { width: 100%; height: 100%; display: block; }
  .planet-name {
    font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px;
    color: var(--hud-cyan); background: rgba(3, 7, 18, 0.8); padding: 2px 8px;
    border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 4px; text-transform: uppercase;
    white-space: nowrap; box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
  }

  /* Game Main Menu UI Overlay */
  .site-ui {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: grid; grid-template-rows: 80px 1fr 60px; padding: 24px 40px;
  }
  .site-ui > * { pointer-events: auto; }

  /* Header Header / HUD Top Bar */
  .hud-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(0, 240, 255, 0.2); padding-bottom: 16px;
    background: linear-gradient(180deg, rgba(3,7,18,0.9) 0%, transparent 100%);
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-mark {
    width: 32px; height: 32px; border: 2px solid var(--hud-cyan);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-weight: 900; color: var(--hud-cyan);
    box-shadow: 0 0 15px var(--hud-cyan-glow); transform: rotate(45deg);
  }
  .brand-mark span { transform: rotate(-45deg); }
  .brand-info h1 {
    margin: 0; font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 800;
    letter-spacing: 3px; color: var(--text-main); text-shadow: 0 0 10px rgba(240,246,252,0.4);
  }
  .brand-info p {
    margin: 2px 0 0; font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 2px; color: var(--hud-cyan);
  }

  .hud-stats {
    display: flex; gap: 24px; font-family: 'Share Tech Mono', monospace; font-size: 12px;
    color: var(--text-muted);
  }
  .stat-box {
    background: var(--hud-cyan-dim); border: 1px solid rgba(0, 240, 255, 0.3);
    padding: 6px 14px; border-radius: 4px; display: flex; flex-direction: column; gap: 2px;
  }
  .stat-box .label { font-size: 9px; color: var(--hud-cyan); letter-spacing: 1px; }
  .stat-box .val { font-weight: bold; color: var(--text-main); }

  /* Game Main Menu Center / Navigation Hub */
  .game-menu-container {
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    padding-left: 4vw; gap: 32px; transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .universe.is-zoomed ~ .site-ui .game-menu-container,
  .site-ui.is-section .game-menu-container {
    opacity: 0; pointer-events: none; transform: translateX(-40px);
  }

  .menu-title-block {
    display: flex; flex-direction: column; gap: 8px;
  }
  .menu-eyebrow {
    font-family: 'Share Tech Mono', monospace; font-size: 13px; letter-spacing: 4px;
    color: var(--hud-amber); text-transform: uppercase; display: flex; align-items: center; gap: 8px;
  }
  .menu-eyebrow::before {
    content: ""; display: inline-block; width: 8px; height: 8px; background: var(--hud-amber);
    box-shadow: 0 0 10px var(--hud-amber);
  }
  .menu-main-title {
    margin: 0; font-family: 'Orbitron', sans-serif; font-size: clamp(38px, 6vw, 72px);
    font-weight: 900; letter-spacing: 4px; color: #fff;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.5), 0 0 60px rgba(0, 240, 255, 0.2);
    line-height: 1.1;
  }
  .menu-subtitle {
    font-size: 16px; color: var(--text-muted); max-width: 500px;
    font-weight: 500; letter-spacing: 0.5px;
  }

  /* Game Menu Buttons (Like Main Menu) */
  .nav-game-menu {
    display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 420px;
  }
  .nav-game-btn {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; background: rgba(3, 7, 18, 0.75);
    border: 1px solid rgba(0, 240, 255, 0.3); border-left: 4px solid var(--hud-cyan);
    color: var(--text-main); text-align: left; cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
    clip-path: polygon(0 0, 100% 0, 96% 100%, 0 100%);
  }
  .nav-game-btn::before {
    content: ""; position: absolute; inset: 0; background: var(--hud-cyan);
    opacity: 0; transition: opacity 0.25s ease; z-index: -1;
  }
  .nav-game-btn:hover, .nav-game-btn.is-cursor {
    border-color: var(--hud-cyan); background: rgba(0, 240, 255, 0.15);
    transform: translateX(12px); box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.2);
    color: #fff;
  }
  .nav-game-btn.active {
    border-left-color: var(--hud-amber); background: rgba(255, 183, 0, 0.15);
    box-shadow: 0 0 25px rgba(255, 183, 0, 0.3);
  }
  .nav-game-btn .btn-idx {
    font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--hud-cyan);
    letter-spacing: 2px;
  }
  .nav-game-btn:hover .btn-idx, .nav-game-btn.is-cursor .btn-idx { color: #fff; }
  .nav-game-btn .btn-text {
    font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px;
  }
  .nav-game-btn .btn-planet {
    font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* Hidden original nav for JS compatibility */
  .nav { display: none; }

  /* In-Game Section Panel (HUD Screen) */
  .panel {
    position: fixed; right: -600px; top: 100px; bottom: 100px; width: 520px;
    background: rgba(3, 7, 18, 0.92); border: 1px solid var(--hud-cyan);
    border-right: none; box-shadow: -10px 0 40px rgba(0, 240, 255, 0.2), inset 0 0 30px rgba(0, 240, 255, 0.05);
    padding: 36px; z-index: 20; overflow-y: auto;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
    opacity: 0; backdrop-filter: blur(12px);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 20px 100%);
  }
  .panel.screen-open {
    transform: translateX(-600px); opacity: 1;
  }

  .section-head {
    display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;
    border-bottom: 1px solid rgba(0, 240, 255, 0.2); padding-bottom: 16px;
  }
  .section-title-top {
    display: flex; justify-content: space-between; align-items: center;
  }
  .eyebrow {
    font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 2px; color: var(--hud-cyan);
  }
  .home-button {
    background: rgba(0, 240, 255, 0.1); border: 1px solid var(--hud-cyan);
    color: var(--hud-cyan); padding: 6px 14px; font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 1px; cursor: pointer;
    transition: all 0.2s ease;
  }
  .home-button:hover {
    background: var(--hud-cyan); color: #030712; box-shadow: 0 0 15px var(--hud-cyan);
  }
  .section-title h2 {
    margin: 8px 0 0; font-family: 'Orbitron', sans-serif; font-size: 28px;
    font-weight: 800; letter-spacing: 2px; color: #fff;
  }
  .body-copy {
    font-size: 16px; line-height: 1.6; color: var(--text-muted); margin-bottom: 24px;
  }

  /* Detail Lists & Sector Cards */
  .detail-list {
    list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px;
  }
  .detail-list li {
    background: rgba(0, 240, 255, 0.04); border: 1px solid rgba(0, 240, 255, 0.15);
    padding: 14px 18px; display: flex; flex-direction: column; gap: 4px;
    border-left: 3px solid var(--hud-cyan);
  }
  .detail-list strong {
    font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 1px; color: var(--text-main);
  }
  .detail-list span { font-size: 14px; color: var(--text-muted); }

  /* HUD Footer & Controls Legend */
  .hud-footer {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(0, 240, 255, 0.2); padding-top: 16px;
    background: linear-gradient(0deg, rgba(3,7,18,0.9) 0%, transparent 100%);
    font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--text-muted);
  }
  .controls-legend {
    display: flex; gap: 16px;
  }
  .controls-legend span {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    padding: 4px 10px; border-radius: 3px; color: var(--text-main);
  }
  .system-status-indicator {
    display: flex; align-items: center; gap: 8px; color: #22c55e;
  }
  .status-dot {
    width: 8px; height: 8px; background: #22c55e; border-radius: 50%;
    box-shadow: 0 0 10px #22c55e; animation: pulseDot 2s infinite;
  }
  @keyframes pulseDot { 50% { opacity: 0.3; } }

  /* Tooltip */
  .planet-tooltip {
    position: fixed; z-index: 50; padding: 6px 12px; background: rgba(3, 7, 18, 0.9);
    border: 1px solid var(--hud-cyan); font-family: 'Share Tech Mono', monospace;
    font-size: 12px; color: var(--hud-cyan); pointer-events: none; opacity: 0;
    transition: opacity 0.2s ease; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
  }

  /* Responsive styling */
  @media (max-width: 900px) {
    .site-ui { padding: 16px; }
    .game-menu-container { padding-left: 0; align-items: center; text-align: center; }
    .nav-game-menu { width: 100%; max-width: 100%; }
    .panel { width: 100%; right: -100%; top: auto; bottom: 0; height: 75vh; }
    .panel.screen-open { transform: translateY(-100%); right: 0; }
  }
</style>
</head>
<body>
<div class="vignette"></div>

<div class="universe" id="universe" aria-label="Top-down solar system portfolio">
  <div class="starfield"></div>

  <!-- Sun Revolution Path Rings (Concentric circles representing orbits, NO animation) -->
  <div class="orbit-ring" style="width: 320px; height: 320px;"></div>
  <div class="orbit-ring" style="width: 500px; height: 500px;"></div>
  <div class="orbit-ring" style="width: 680px; height: 680px;"></div>
  <div class="orbit-ring" style="width: 880px; height: 880px;"></div>
  <div class="orbit-ring" style="width: 1100px; height: 1100px;"></div>
  <div class="orbit-ring" style="width: 1360px; height: 1360px;"></div>
  <div class="orbit-ring" style="width: 1620px; height: 1620px;"></div>
  <div class="orbit-ring" style="width: 1900px; height: 1900px;"></div>

  <!-- Correct Solar System Order from Sun outwards -->
  <div class="orbit mercury" style="--diameter: 320px;"><div class="track"><button class="planet-button" data-planet="mercury" data-section="contact" aria-label="Mercury — open Open Comms"><span class="planet-body"><canvas class="orbit-planet" aria-hidden="true"></canvas></span><span class="planet-name">Mercury</span></button></div></div>
  <div class="orbit venus" style="--diameter: 500px;"><div class="track"><button class="planet-button" data-planet="venus" data-section="about" aria-label="Venus — open Crew Profile"><span class="planet-body"><canvas class="orbit-planet" aria-hidden="true"></canvas></span><span class="planet-name">Venus</span></button></div></div>
  <div class="orbit earth" style="--diameter: 680px;"><div class="track"><button class="planet-button" data-planet="earth" data-section="about" aria-label="Earth — open Crew Profile"><span class="planet-body"><canvas class="orbit-planet" aria-hidden="true"></canvas></span><span class="planet-name">Earth</span></button></div></div>
  <div class="orbit mars" style="--diameter: 880px;"><div class="track"><button class="planet-button" data-planet="mars" data-section="skills" aria-label="Mars — open Flight Systems"><span class="planet-body"><canvas class="orbit-planet" aria-hidden="true"></canvas></span><span class="planet-name">Mars</span></button></div></div>
  <div class="orbit jupiter" style="--diameter: 1100px;"><div class="track"><button class="planet-button" data-planet="jupiter" data-section="projects" aria-label="Jupiter — open Projects"><span class="planet-body"><canvas class="orbit-planet" aria-hidden="true"></canvas></span><span class="planet-name">Jupiter</span></button></div></div>
  <div class="orbit saturn" style="--diameter: 1360px;"><div class="track"><button class="planet-button" data-planet="saturn" data-section="projects" aria-label="Saturn — open Projects"><span class="planet-body"><canvas class="orbit-planet" aria-hidden="true"></canvas></span><span class="planet-name">Saturn</span></button></div></div>
  <div class="orbit uranus" style="--diameter: 1620px;"><div class="track"><button class="planet-button" data-planet="uranus" data-section="skills" aria-label="Uranus — open Flight Systems"><span class="planet-body"><canvas class="orbit-planet" aria-hidden="true"></canvas></span><span class="planet-name">Uranus</span></button></div></div>
  <div class="orbit neptune" style="--diameter: 1900px;"><div class="track"><button class="planet-button" data-planet="neptune" data-section="contact" aria-label="Neptune — open Open Comms"><span class="planet-body"><canvas class="orbit-planet" aria-hidden="true"></canvas></span><span class="planet-name">Neptune</span></button></div></div>

  <button class="sun" id="sun" aria-label="Sun — return to command center"><span class="sun-label">The Sun</span></button>
</div>

<div class="site-ui">
  <!-- HUD Top Header -->
  <header class="hud-header">
    <div class="brand">
      <div class="brand-mark"><span>FJ</span></div>
      <div class="brand-info">
        <h1>FAHAD JAVED</h1>
        <p>SOLAR SYSTEM COMMAND v2.5</p>
      </div>
    </div>
    <div class="hud-stats">
      <div class="stat-box">
        <span class="label">SECTOR</span>
        <span class="val">SOL-03</span>
      </div>
      <div class="stat-box">
        <span class="label">SYSTEM STATUS</span>
        <span class="val" style="color: var(--hud-cyan);">ONLINE</span>
      </div>
    </div>
  </header>

  <!-- Game Main Menu Center (Game Style Menu) -->
  <main class="game-menu-container" aria-label="Game Main Menu">
    <div class="menu-title-block">
      <div class="menu-eyebrow">COMMAND DECK // INTERACTIVE PORTFOLIO</div>
      <h2 class="menu-main-title">FAHAD JAVED</h2>
      <div class="menu-subtitle">Select a mission module or explore the solar system interface.</div>
    </div>

    <div class="nav-game-menu" aria-label="Main Menu Options">
      <button class="nav-game-btn" data-index="01" data-section="about" data-target="earth">
        <span class="btn-idx">01</span>
        <span class="btn-text">PLAY / CREW PROFILE</span>
        <span class="btn-planet">Earth</span>
      </button>
      <button class="nav-game-btn" data-index="02" data-section="projects" data-target="jupiter">
        <span class="btn-idx">02</span>
        <span class="btn-text">MISSIONS / PROJECTS</span>
        <span class="btn-planet">Jupiter</span>
      </button>
      <button class="nav-game-btn" data-index="03" data-section="skills" data-target="mars">
        <span class="btn-idx">03</span>
        <span class="btn-text">FLIGHT SYSTEMS / SKILLS</span>
        <span class="btn-planet">Mars</span>
      </button>
      <button class="nav-game-btn" data-index="04" data-section="contact" data-target="neptune">
        <span class="btn-idx">04</span>
        <span class="btn-text">OPEN COMMS / CONTACT</span>
        <span class="btn-planet">Neptune</span>
      </button>
    </div>
  </main>

  <!-- Hidden legacy nav for JS compatibility -->
  <nav class="nav" aria-label="Portfolio sections">
    <button data-index="01" data-section="about" data-target="earth"><span class="menu-label">Crew Profile</span></button>
    <button data-index="02" data-section="projects" data-target="jupiter"><span class="menu-label">Missions</span></button>
    <button data-index="03" data-section="skills" data-target="mars"><span class="menu-label">Flight Systems</span></button>
    <button data-index="04" data-section="contact" data-target="neptune"><span class="menu-label">Open Comms</span></button>
  </nav>

  <!-- Slide-out HUD Panel for Sections -->
  <section class="panel" id="panel" aria-live="polite"></section>

  <!-- HUD Footer -->
  <footer class="hud-footer">
    <div class="controls-legend">
      <span>ENTER / CLICK: LAUNCH</span>
      <span>ESC: SYSTEM HOME</span>
    </div>
    <div class="system-status-indicator">
      <div class="status-dot"></div>
      <span>TELEMETRY SECURE</span>
    </div>
  </footer>
</div>

<div class="planet-tooltip" id="tooltip" role="status"></div>

<script src="./portfolio.js" defer></script>
<script>
  // Bridge game menu buttons to the original portfolio logic
  window.addEventListener('DOMContentLoaded', () => {
    const gameButtons = document.querySelectorAll('.nav-game-btn');
    const legacyButtons = document.querySelectorAll('.nav button');

    gameButtons.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        if (legacyButtons[idx]) {
          legacyButtons[idx].click();
        }
      });
      btn.addEventListener('focus', () => {
        gameButtons.forEach(b => b.classList.remove('is-cursor'));
        btn.classList.add('is-cursor');
        if (legacyButtons[idx]) {
          legacyButtons[idx].focus({preventScroll: true});
        }
      });
    });
  });
</script>
</body>
</html>
